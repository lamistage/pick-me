version: '2'
services:
  db:
    image: postgres:17-alpine
    container_name: pick-me.db
    hostname: db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=pick_me_db
      - POSTGRES_USER=pick_me_user
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
  #    restart: always

  db2:
    image: postgres:17-alpine
    container_name: pick-me.db2
    hostname: db2
    volumes:
      - /var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=pick_me_db
      - POSTGRES_USER=pick_me_user
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
  #    restart: always
