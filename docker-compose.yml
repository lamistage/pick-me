  db2:
    image: postgres:17-alpine
    container_name: pick-me.db2
    hostname: db2
    volumes:
      - /var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=pick_me_db
      - POSTGRES_USER=pick_me_user
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

  redis:
    image: redis:latest
    container_name: pick-me.redis
    hostname: redis
    ports:
      - 6379:6379

  backend:
    image: lamistage/pick-me-backend:0.0.3
    ports:
      - 8080:8080
    depends_on:
      - db2
    environment:
      - POSTGRES_DB=pick_me_db
      - POSTGRES_USER=pick_me_user
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_HOST=db2
      - POSTGRES_PORT=5432

  frontend:
    image: lamistage/pick-me-frontend:0.0.3
    ports:
      - 4200:4200
    depends_on:
      - backend
