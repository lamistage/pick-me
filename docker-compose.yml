#      - POSTGRES_PORT=5432
#  #    restart: always

  db2:
    image: postgres:17-alpine
    container_name: pick-me.db2
    hostname: db2
    volumes:
      - /var/lib/postgresql/data
    ports:
      - 5432:5432
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pick_me_user -d pick_me_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: pick-me.redis
    hostname: redis
    ports:
      - 6379:6379
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: lamistage/pick-me-backend:0.0.15
    ports:
      - 8080:8080
    depends_on:
      db2:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    image: lamistage/pick-me-frontend:0.0.7
    ports:
      - 4200:4200
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
